<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#02060c" />
  <title>The Hangar | Hangar One Preservation</title>
  <meta name="description" content="The Hangar — automotive and aviation preservation by Hangar One Preservation." />
  <link rel="canonical" href="https://h1preservation.com/hangar.html" />
  <style>
    :root{--black:#02060c;--white:#f6f8fb;--blue:#2398ff;--blue-hi:#78c9ff;--orange:#ff6a00;--orange-hi:#ffad64}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--black)}
    body{min-height:100svh;overflow:hidden;color:var(--white);font-family:Arial,Helvetica,sans-serif;letter-spacing:.08em}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}

    .hangar{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;background:#01050a}
    .hangar-image{position:absolute;inset:0;z-index:-4;width:100%;height:100%;object-fit:cover;object-position:center 56%;filter:contrast(1.05) saturate(1.08) brightness(.91);transform:scale(1.002)}
    .hangar::before{
      content:"";position:absolute;inset:0;z-index:-3;pointer-events:none;
      background:
        linear-gradient(180deg,rgba(0,3,8,.78) 0%,rgba(0,4,10,.16) 22%,transparent 54%,rgba(0,3,8,.12) 100%),
        radial-gradient(ellipse at 15% 54%,rgba(35,152,255,.11),transparent 37%),
        radial-gradient(ellipse at 86% 57%,rgba(255,106,0,.09),transparent 34%);
    }
    .hangar::after{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.13) 67%,rgba(0,0,0,.58) 100%);box-shadow:inset 0 0 100px rgba(0,0,0,.54)}

    .frame{position:fixed;inset:10px;z-index:5;pointer-events:none;border:1px solid rgba(71,167,255,.56);clip-path:polygon(0 24px,24px 0,28% 0,29.2% 15px,97.8% 15px,100% 39px,100% 100%,0 100%);box-shadow:inset 0 0 20px rgba(35,152,255,.08),0 0 16px rgba(35,152,255,.13)}
    .frame::before{content:"";position:absolute;inset:-1px -1px auto 62%;height:1px;background:linear-gradient(90deg,transparent,var(--orange));box-shadow:0 0 16px rgba(255,106,0,.7)}
    .frame::after{content:"";position:absolute;right:-1px;top:38px;bottom:0;width:1px;background:linear-gradient(180deg,var(--orange),rgba(255,106,0,.08) 38%,transparent 75%);box-shadow:0 0 15px rgba(255,106,0,.64)}

    .topbar{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:24px;width:min(1500px,calc(100% - 96px));min-height:124px;margin:0 auto}
    .brand{display:inline-flex;align-items:center;flex:0 0 auto}
    .brand img{width:128px;height:auto;mix-blend-mode:screen;filter:contrast(1.52) brightness(1.05) drop-shadow(-7px 0 13px rgba(35,152,255,.21)) drop-shadow(7px 0 13px rgba(255,106,0,.17))}
    .top-actions{display:flex;align-items:center;gap:16px;text-transform:uppercase;font-size:.68rem;font-weight:900;letter-spacing:.18em}
    .back-link,.book-link{min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;transition:background .2s ease,box-shadow .2s ease,filter .2s ease,transform .2s ease}
    .back-link{padding:0 18px;border:1px solid rgba(92,182,255,.62);background:rgba(2,10,20,.58);backdrop-filter:blur(15px) saturate(140%);-webkit-backdrop-filter:blur(15px) saturate(140%);box-shadow:inset 0 1px rgba(255,255,255,.08),0 0 18px rgba(35,152,255,.13)}
    .book-link{padding:0 22px;border:1px solid rgba(255,186,116,.92);background:linear-gradient(180deg,#ff842d 0%,#ff5f00 56%,#bc3d00 100%);box-shadow:inset 0 1px rgba(255,255,255,.28),0 0 22px rgba(255,106,0,.38),0 12px 36px rgba(255,106,0,.18)}
    .back-link:hover,.book-link:hover{transform:translateY(-2px)}
    .back-link:hover{background:rgba(9,37,68,.72);box-shadow:inset 0 1px rgba(255,255,255,.12),0 0 25px rgba(35,152,255,.25)}
    .book-link:hover{filter:brightness(1.08);box-shadow:inset 0 1px rgba(255,255,255,.3),0 0 29px rgba(255,106,0,.54),0 14px 40px rgba(255,106,0,.2)}

    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .bottom-mark{position:absolute;z-index:4;left:50%;bottom:30px;transform:translateX(-50%);display:flex;align-items:center;gap:17px;color:rgba(246,248,251,.78);font-size:.63rem;font-weight:900;letter-spacing:.34em;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 14px rgba(0,0,0,.8)}
    .bottom-mark::before,.bottom-mark::after{content:"";width:75px;height:1px}
    .bottom-mark::before{background:linear-gradient(90deg,transparent,var(--blue-hi));box-shadow:0 0 10px rgba(35,152,255,.7)}
    .bottom-mark::after{background:linear-gradient(90deg,var(--orange-hi),transparent);box-shadow:0 0 10px rgba(255,106,0,.7)}

    @media(max-width:800px){
      .hangar-image{object-position:56% center;filter:contrast(1.06) saturate(1.1) brightness(.86)}
      .topbar{width:calc(100% - 42px);min-height:98px;gap:12px}
      .brand img{width:94px}
      .top-actions{gap:8px;font-size:.55rem;letter-spacing:.12em}
      .back-link,.book-link{min-height:39px;padding:0 12px}
      .bottom-mark{bottom:22px;font-size:.54rem;letter-spacing:.23em;gap:10px}
      .bottom-mark::before,.bottom-mark::after{width:35px}
      .frame{inset:5px}
    }
    @media(max-width:480px){
      .topbar{width:calc(100% - 28px);min-height:86px}
      .brand img{width:77px}
      .top-actions{font-size:.49rem;letter-spacing:.09em}
      .back-link{padding:0 9px}
      .book-link{padding:0 10px}
      .bottom-mark{font-size:.49rem;letter-spacing:.17em}
      .bottom-mark::before,.bottom-mark::after{width:22px}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
